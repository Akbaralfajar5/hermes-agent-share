<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} - Poster</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=UnifrakturMaguntia&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

  /* === POSTER CANVAS — adjust width/height for target platform === */
  .poster { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #050100; }

  /* === z1: BACKGROUND === */
  .bg { position:absolute; inset:0; background: radial-gradient(ellipse 150% 100% at 50% 40%, {{BG_MID}} 0%, {{BG_DARK}} 60%, {{BG_DARKEST}} 100%); z-index:1; }

  /* === z2: COLOR GLOW BLOBS (animated) === */
  .fg { position:absolute; filter:blur(80px); z-index:2; pointer-events:none; }
  .fg1 { top:0; left:-10%; width:60%; height:80%; background:radial-gradient(ellipse,{{GLOW_PRIMARY}},transparent 70%); animation:pa 5s ease-in-out infinite alternate; }
  .fg2 { top:-5%; right:-10%; width:55%; height:75%; background:radial-gradient(ellipse,{{GLOW_SECONDARY}},transparent 70%); filter:blur(70px); animation:pb 6s ease-in-out infinite alternate; }
  .fg3 { bottom:0; left:5%; width:90%; height:45%; background:radial-gradient(ellipse,{{GLOW_BOTTOM}},transparent 70%); filter:blur(70px); animation:pa 4s ease-in-out infinite alternate; }
  @keyframes pa{0%{opacity:.7;transform:scale(1)}100%{opacity:1;transform:scale(1.04)}}
  @keyframes pb{0%{opacity:.8;transform:scale(1.03)}100%{opacity:.6;transform:scale(1)}}

  /* === z10: PHOTO — adjust top, height, object-position per photo === */
  .photo-wrap {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
    width: 1080px; height: 820px; z-index: 10; overflow: hidden;
    -webkit-mask-image: radial-gradient(ellipse 75% 60% at 50% 45%, black 50%, transparent 85%);
    mask-image: radial-gradient(ellipse 75% 60% at 50% 45%, black 50%, transparent 85%);
  }
  .photo-wrap img { width:100%; height:100%; object-fit:cover; object-position:center 20%; filter:contrast(1.4) saturate(0.75) brightness(1.1); }

  /* === z11: COLOR GRADE === */
  .cg1 { position:absolute; inset:0; background:linear-gradient(160deg,{{CG_1}},{{CG_2}} 30%,{{CG_3}} 60%,{{CG_4}}); mix-blend-mode:color; z-index:11; pointer-events:none; }
  .cg2 { position:absolute; inset:0; background:linear-gradient(180deg,{{CG_OV1}},{{CG_OV2}} 50%,{{CG_OV3}}); mix-blend-mode:overlay; z-index:11; pointer-events:none; }

  /* === z12: VIGNETTE === */
  .vig { position:absolute; inset:0; background:radial-gradient(ellipse 60% 55% at 50% 40%, transparent 30%, rgba(0,0,0,.4) 55%, rgba(0,0,0,.8) 75%, rgba(0,0,0,.97) 100%); z-index:12; }

  /* === z13: TOP/BOTTOM FADES === */
  .tf { position:absolute; top:0; left:0; right:0; height:200px; background:linear-gradient(to bottom,rgba(10,2,0,.97),rgba(10,2,0,.4) 60%,transparent); z-index:13; }
  .bf { position:absolute; bottom:0; left:0; right:0; height:380px; background:linear-gradient(to top,rgba(5,1,0,1),rgba(10,2,0,.95) 30%,rgba(15,3,0,.6) 60%,transparent); z-index:13; }

  /* === z14: EFFECTS (flares, heat lines) === */
  .fl { position:absolute; border-radius:50%; z-index:14; pointer-events:none; }
  .fl1 { top:3%; right:-2%; width:500px; height:500px; background:radial-gradient(circle,{{FLARE_COLOR}},transparent 65%); filter:blur(55px); animation:fg 5s ease-in-out infinite alternate; }
  .fl3 { bottom:8%; left:50%; transform:translateX(-50%); width:950px; height:280px; background:radial-gradient(ellipse,{{FLARE_BOTTOM}},transparent 70%); filter:blur(55px); animation:fg 4s ease-in-out infinite alternate; }
  @keyframes fg{0%{opacity:.55}100%{opacity:1}}

  /* === z16: SPARKS (JS-generated) === */
  .sp { position:absolute; inset:0; z-index:16; pointer-events:none; overflow:hidden; }
  .s { position:absolute; border-radius:50%; animation:sr linear infinite; }
  @keyframes sr {
    0%{transform:translateY(0) translateX(0) scale(1);opacity:1}
    40%{transform:translateY(-180px) translateX(-18px) scale(.75);opacity:.75}
    100%{transform:translateY(-580px) translateX(6px) scale(.08);opacity:0}
  }

  /* === z20: TYPOGRAPHY === */
  .t-gothic { position:absolute; top:28px; left:42px; z-index:20; font-family:'UnifrakturMaguntia',cursive; font-size:54px; color:#fff; text-shadow:0 0 25px {{TEXT_GLOW}},0 0 50px {{TEXT_GLOW_MID}},3px 3px 8px rgba(0,0,0,.95); letter-spacing:2px; }
  .t-sub { position:absolute; top:35px; right:42px; z-index:20; font-family:'Bebas Neue',sans-serif; font-size:26px; color:{{SUBTITLE_COLOR}}; text-shadow:0 0 15px {{TEXT_GLOW}}; letter-spacing:10px; text-align:right; line-height:1.3; }
  .t-main { position:absolute; bottom:35px; left:0; right:0; z-index:20; text-align:center; }
  .t-main h1 { font-family:'Anton',sans-serif; font-size:140px; color:#fff; letter-spacing:14px; line-height:.88; text-transform:uppercase;
    text-shadow: 0 0 15px {{TEXT_GLOW}}, 0 0 30px {{TEXT_GLOW_MID}}, 0 0 60px {{TEXT_GLOW_FAR}}, 0 0 100px {{TEXT_GLOW_FARTHEST}}, 6px 6px 0 {{TEXT_SHADOW_HARD}};
  }
  .t-tag { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); z-index:20; font-family:'Bebas Neue',sans-serif; font-size:30px; color:{{TAGLINE_COLOR}}; letter-spacing:16px; text-shadow:0 0 20px {{TEXT_GLOW}}; }

  /* === z20: DECORATIVE === */
  .sb{position:absolute;top:0;width:6px;height:100%;z-index:20}
  .sbl{left:0;background:linear-gradient(to bottom,transparent 3%,{{SIDE_BAR_1}} 15%,{{SIDE_BAR_2}} 50%,{{SIDE_BAR_1}} 85%,transparent 97%);box-shadow:0 0 20px {{SIDE_GLOW}}}
  .sbr{right:0;background:linear-gradient(to bottom,transparent 3%,{{SIDE_BAR_2}} 15%,{{SIDE_BAR_1}} 50%,{{SIDE_BAR_2}} 85%,transparent 97%);box-shadow:0 0 20px {{SIDE_GLOW}}}
  .c{position:absolute;width:55px;height:55px;z-index:20}
  .ctl{top:12px;left:12px;border-top:3px solid {{CORNER_COLOR}};border-left:3px solid {{CORNER_COLOR}}}
  .ctr{top:12px;right:12px;border-top:3px solid {{CORNER_COLOR}};border-right:3px solid {{CORNER_COLOR}}}
  .cbl{bottom:12px;left:12px;border-bottom:3px solid {{CORNER_COLOR}};border-left:3px solid {{CORNER_COLOR}}}
  .cbr{bottom:12px;right:12px;border-bottom:3px solid {{CORNER_COLOR}};border-right:3px solid {{CORNER_COLOR}}}

  /* === z25: FILM GRAIN === */
  .gr{position:absolute;inset:0;z-index:25;opacity:.04;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
</style>
</head>
<body>
<div class="poster">
  <div class="bg"></div>
  <div class="fg fg1"></div>
  <div class="fg fg2"></div>
  <div class="fg fg3"></div>

  <div class="photo-wrap">
    <img src="{{PHOTO_PATH}}" alt="{{ALT_TEXT}}">
  </div>

  <div class="cg1"></div>
  <div class="cg2"></div>
  <div class="vig"></div>
  <div class="tf"></div>
  <div class="bf"></div>

  <div class="fl fl1"></div>
  <div class="fl fl3"></div>

  <div class="sp" id="sp"></div>

  <!-- Typography — customize text content -->
  <div class="t-gothic">{{GOTHIC_HEADER}}</div>
  <div class="t-sub">{{SUBTITLE_LINE1}}<br>{{SUBTITLE_LINE2}}</div>
  <div class="t-main"><h1>{{MAIN_TITLE_LINE1}}<br>{{MAIN_TITLE_LINE2}}</h1></div>
  <div class="t-tag">★ {{TAGLINE}} ★</div>

  <!-- Decorative -->
  <div class="sb sbl"></div>
  <div class="sb sbr"></div>
  <div class="c ctl"></div>
  <div class="c ctr"></div>
  <div class="c cbl"></div>
  <div class="c cbr"></div>
  <div class="gr"></div>
</div>

<script>
// Spark particle generator — adjust colors array for theme
const sp=document.getElementById('sp');
const cc={{SPARK_COLORS}}; // e.g. ['#ff2200','#ff4400','#ff6600','#ff8800','#ffaa00','#ffcc00']

// Tier 1: Small sparks
for(let i=0;i<120;i++){const s=document.createElement('div');s.className='s';const z=Math.random()*4+1.5,x=Math.random()*100,y=50+Math.random()*50,d=Math.random()*5+3,dl=Math.random()*7,c=cc[~~(Math.random()*cc.length)];s.style.cssText=`width:${z}px;height:${z}px;left:${x}%;top:${y}%;background:${c};box-shadow:0 0 ${z*4}px ${c},0 0 ${z*8}px ${c}50;animation-duration:${d}s;animation-delay:${dl}s`;sp.appendChild(s)}

// Tier 2: Medium embers
for(let i=0;i<35;i++){const s=document.createElement('div');s.className='s';const z=Math.random()*10+5,x=Math.random()*100,y=40+Math.random()*60,d=Math.random()*7+5,dl=Math.random()*6,c=cc[~~(Math.random()*cc.length)];s.style.cssText=`width:${z}px;height:${z}px;left:${x}%;top:${y}%;background:radial-gradient(circle,${c}99,${c}33,transparent);box-shadow:0 0 ${z*3}px ${c}40;animation-duration:${d}s;animation-delay:${dl}s;opacity:.7`;sp.appendChild(s)}

// Tier 3: Large bokeh
for(let i=0;i<15;i++){const s=document.createElement('div');s.className='s';const z=Math.random()*28+15,x=5+Math.random()*90,y=60+Math.random()*40,d=Math.random()*9+7,dl=Math.random()*5,c=cc[~~(Math.random()*5)];s.style.cssText=`width:${z}px;height:${z}px;left:${x}%;top:${y}%;background:radial-gradient(circle,${c}55,${c}15,transparent);box-shadow:0 0 ${z*2}px ${c}25;animation-duration:${d}s;animation-delay:${dl}s;opacity:.4;filter:blur(3px)`;sp.appendChild(s)}
</script>
</body>
</html>
